[project]
name = "postgres-mcp-analyst"
version = "0.1.0"
description = "Read-only PostgreSQL MCP server for conversational data analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.0.0",
    "sqlglot>=30.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
postgres-mcp-analyst = "postgres_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgres_mcp"]
